<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>契約事業所 住所録 | 匡電気管理事務所</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --navy:#2E3578; --navy-d:#232a5e; --navy-l:#eceef7;
  --bg:#f4f5f9; --card:#fff; --line:#e2e4ee;
  --txt:#1c1f33; --sub:#6b6f85; --warn:#b5651d; --warn-bg:#fdf3e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;
  gap:10px;position:sticky;top:0;z-index:50}
header h1{font-size:16px;margin:0;font-weight:600;flex:1}
header .who{font-size:12px;opacity:.85}
.wrap{max-width:840px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--txt)}
input:focus,textarea:focus{outline:2px solid var(--navy-l);border-color:var(--navy)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px;font-weight:600}
button{font-family:inherit;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--txt);cursor:pointer;font-weight:600}
button:active{transform:scale(.98)}
.btn-p{background:var(--navy);color:#fff;border-color:var(--navy);width:100%}
.btn-sm{padding:7px 10px;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:#fff}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.count{font-size:11px;opacity:.75;margin-left:4px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{border-color:var(--navy)}
.item .no{background:var(--navy-l);color:var(--navy);font-size:12px;font-weight:700;
  border-radius:6px;padding:3px 7px;min-width:34px;text-align:center;flex-shrink:0}
.item .nm{font-weight:600;font-size:14px}
.item .ad{font-size:12px;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;
  background:var(--navy-l);color:var(--navy);margin-left:6px;font-weight:600}
.tag.solar{background:#fff5e0;color:#8a6100}
.mapbox{width:100%;height:280px;border:0;border-radius:10px;background:var(--navy-l);display:block}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1}
.keyhead{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.keyhead h3{font-size:14px;margin:0}
.kcard{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-bg);
  border-radius:0;padding:12px 14px;margin-bottom:8px}
.kcard .kp{font-weight:700;font-size:14px}
.kcard .kc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.03em;margin:2px 0}
.kcard .km{font-size:12px;color:var(--sub);white-space:pre-wrap}
.kcard .kb{font-size:11px;color:var(--sub);margin-top:6px}
.back{background:none;border:none;color:#fff;font-size:20px;padding:0 4px;cursor:pointer}
.hide{display:none!important}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.msg.err{background:#fdecec;color:#a32d2d}
.msg.ok{background:#eaf6ee;color:#1d6b3a}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px}
.loading{text-align:center;padding:40px;color:var(--sub);font-size:13px}
.logo{height:26px;width:auto}
.link{font-size:12px;color:var(--navy);text-decoration:underline;cursor:pointer}
.brand{text-align:center;padding:26px 0 18px}
.brand img{width:100%;max-width:290px;height:auto;display:block;margin:0 auto 14px}
.brand .bn{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.04em}
.brand .bs{font-size:12px;color:var(--sub);margin-top:3px}
.brand .mark{width:60px;height:60px;margin:0 auto 12px;border-radius:14px;background:var(--navy);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.gear{background:none;border:none;color:#fff;font-size:18px;padding:0 4px;cursor:pointer;line-height:1}
.sub{font-size:12px;color:var(--sub);margin-top:10px;text-align:center}
body{padding-bottom:env(safe-area-inset-bottom)}
header{padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(28,31,51,.92);
  color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:200;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1}
.btn-out{color:#a32d2d;border-color:#f0cfcf;background:#fff;width:100%;margin-top:14px}
</style>
</head>
<body>

<header>
  <button class="back hide" id="backBtn" onclick="showList()">‹</button>
  <h1 id="ttl">契約事業所 住所録</h1>
  <span class="who" id="who"></span>
  <button class="gear hide" id="gearBtn" onclick="showAccount()" title="アカウント設定">&#9881;</button>
  <button class="gear hide" id="closeBtn" onclick="closeLiff()" title="閉じる">&#10005;</button>
</header>

<!-- 起動時（保存済みログインの確認中） -->
<div class="wrap" id="bootView">
  <div class="loading">ログイン情報を確認中…</div>
</div>

<!-- ログイン -->
<div class="wrap hide" id="loginView">
  <div class="brand">
    <div id="brandMark" class="mark">匡</div>
    <div class="bn">契約事業所 住所録</div>
    <div class="bs" id="brandSub">匡電気管理事務所</div>
  </div>
  <div class="card">
    <div id="loginMsg"></div>
    <label>氏名</label>
    <input id="u" autocomplete="username" placeholder="佐藤 英匡">
    <label>パスワード</label>
    <input id="p" type="password" autocomplete="current-password">
    <div style="height:14px"></div>
    <button class="btn-p" onclick="login()">ログイン</button>
    <div class="sub"><span class="link" onclick="showReset()">パスワードをお忘れの方</span></div>
  </div>
  <div id="resetBox"></div>
</div>

<!-- 一覧 -->
<div class="wrap hide" id="listView">
  <div class="tabs">
    <button id="tabH" class="on" onclick="setBase('本社')">本社<span class="count" id="cH"></span></button>
    <button id="tabA" onclick="setBase('青森支社')">青森支社<span class="count" id="cA"></span></button>
  </div>
  <input id="q" placeholder="事業場名・住所で絞り込み" oninput="render()" style="margin-bottom:10px">
  <div id="list"></div>
</div>

<!-- 詳細 -->
<div class="wrap hide" id="detailView"></div>

<!-- アカウント設定 -->
<div class="wrap hide" id="accountView"></div>
<div class="toast" id="toast"></div>

var TOKEN=null, ME=null, SITES=[], KEYS=[], CAN_EDIT=false, BASE='本社', CUR=null, MAPTYPE='roadmap';

// ===== JSONP =====
function api(params){
  return new Promise(function(res,rej){
    var cb='cb_'+Math.random().toString(36).slice(2);
    var t=setTimeout(function(){cleanup();rej(new Error('タイムアウト'))},25000);
    window[cb]=function(d){clearTimeout(t);cleanup();res(d)};
    function cleanup(){try{delete window[cb]}catch(e){}; if(s.parentNode)s.parentNode.removeChild(s)}
    var qs=Object.keys(params).map(function(k){
      return encodeURIComponent(k)+'='+encodeURIComponent(params[k]==null?'':params[k])}).join('&');
    var s=document.createElement('script');
    s.src=GAS_URL+'?'+qs+'&callback='+cb;
    s.onerror=function(){clearTimeout(t);cleanup();rej(new Error('通信エラー'))};
    document.body.appendChild(s);
  });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

// ===== LIFF =====
// LINEログインは使いません。init するのは openWindow と closeWindow を
// 使うためだけで、認証は従来どおり氏名＋パスワードです。
async function initLiff(){
  if(!LIFF_ID || typeof liff === 'undefined') return;
  try{
    await liff.init({liffId:LIFF_ID});
    IN_LINE = liff.isInClient();
    if(IN_LINE) document.getElementById('closeBtn').classList.remove('hide');
  }catch(e){ /* 初期化に失敗しても通常のWebページとして続行 */ }
}
function closeLiff(){ try{ liff.closeWindow() }catch(e){} }

// LINE内蔵ブラウザでは window.open がブロックされることがあるため外部で開く
function openExternal(url){
  if(IN_LINE){ try{ liff.openWindow({url:url, external:true}); return }catch(e){} }
  window.open(url,'_blank');
}

// ===== トースト =====
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('on')},1800);
}

// ===== ログイン保持 =====
function saveAuth(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({t:TOKEN, n:ME.name})) }catch(e){}
}
function loadAuth(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null') }catch(e){ return null }
}
function clearAuth(){ try{ localStorage.removeItem(LS_KEY) }catch(e){} }

// ===== ログイン =====
async function login(){
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  if(!u||!p){return note('loginMsg','err','氏名とパスワードを入力してください')}
  note('loginMsg','','<div class="loading">認証中…</div>');
  try{
    var r=await api({action:'login',user:u,pass:p});
    if(!r.ok) return note('loginMsg','err',r.error);
    TOKEN=r.token; ME=r.user;
    saveAuth();
    closeReset();
    enterApp();
    await load();
  }catch(e){ note('loginMsg','err',e.message) }
}

// ログイン後の画面遷移（初回ログイン・保存済みログインの両方から呼ばれる）
function enterApp(){
  document.getElementById('who').textContent=ME.name;
  document.getElementById('bootView').classList.add('hide');
  document.getElementById('loginView').classList.add('hide');
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('gearBtn').classList.remove('hide');
  document.getElementById('list').innerHTML='<div class="loading">読み込み中…</div>';
}

// ログイン画面に戻す
function toLogin(prefillName, msg){
  clearAuth(); TOKEN=null; ME=null; SITES=[]; KEYS=[]; CUR=null;
  document.getElementById('bootView').classList.add('hide');
  document.getElementById('listView').classList.add('hide');
  document.getElementById('detailView').classList.add('hide');
  document.getElementById('accountView').classList.add('hide');
  document.getElementById('gearBtn').classList.add('hide');
  document.getElementById('backBtn').classList.add('hide');
  document.getElementById('who').textContent='';
  document.getElementById('ttl').textContent='契約事業所 住所録';
  document.getElementById('loginView').classList.remove('hide');
  if(prefillName) document.getElementById('u').value=prefillName;
  document.getElementById('p').value='';
  note('loginMsg', msg?'err':'', msg||'');
  window.scrollTo(0,0);
}

// ===== 起動 =====
async function boot(){
  await initLiff();
  var a=loadAuth();
  if(!(a&&a.t)){ toLogin('',''); return }
  TOKEN=a.t; ME={name:a.n||''};
  try{
    var r=await api({action:'list',token:TOKEN});
    if(r.ok){ enterApp(); applyList(r); return }
  }catch(e){}
  toLogin(a.n||'', 'ログインの有効期限が切れました。もう一度ログインしてください。');
}
function note(id,cls,html){
  var el=document.getElementById(id);
  el.innerHTML= cls? '<div class="msg '+cls+'">'+html+'</div>' : html;
}

function applyList(r){
  SITES=r.sites; KEYS=r.keys; CAN_EDIT=r.canEditKey;
  document.getElementById('cH').textContent=SITES.filter(function(s){return s.base==='本社'}).length;
  document.getElementById('cA').textContent=SITES.filter(function(s){return s.base==='青森支社'}).length;
  render();
}

async function load(){
  var name = ME && ME.name;
  try{
    var r=await api({action:'list',token:TOKEN});
    if(!r.ok){ toLogin(name,'ログインの有効期限が切れました。もう一度ログインしてください。'); return }
    applyList(r);
  }catch(e){
    document.getElementById('list').innerHTML=
      '<div class="empty">通信できませんでした。電波状況を確認して開き直してください。</div>';
  }
}

function setBase(b){
  BASE=b;
  document.getElementById('tabH').classList.toggle('on',b==='本社');
  document.getElementById('tabA').classList.toggle('on',b==='青森支社');
  render();
}

function render(){
  var q=document.getElementById('q').value.trim();
  var arr=SITES.filter(function(s){
    if(s.base!==BASE) return false;
    if(!q) return true;
    return (s.name+s.addr).indexOf(q)>=0;
  });
  var el=document.getElementById('list');
  if(!arr.length){el.innerHTML='<div class="empty">該当する事業所がありません</div>';return}
  el.innerHTML=arr.map(function(s){
    var nk=KEYS.filter(function(k){return k.siteId===s.id}).length;
    return '<div class="item" onclick="showDetail(\''+s.id+'\')">'+
      '<span class="no">'+esc(s.no)+'</span><div style="flex:1;min-width:0">'+
      '<div class="nm">'+esc(s.name)+
        (s.kind==='太陽光'?'<span class="tag solar">太陽光</span>':'')+
        (nk?'<span class="tag">鍵'+nk+'</span>':'')+'</div>'+
      '<div class="ad">'+esc(s.addr)+'</div></div></div>';
  }).join('');
}

function showList(){
  CUR=null;
  document.getElementById('detailView').classList.add('hide');
  document.getElementById('accountView').classList.add('hide');
  document.getElementById('listView').classList.remove('hide');
  document.getElementById('backBtn').classList.add('hide');
  document.getElementById('ttl').textContent='契約事業所 住所録';
  window.scrollTo(0,0);
}

function mapSrc(s){
  var q = (s.lat&&s.lng) ? (s.lat+','+s.lng) : s.addr;
  return 'https://www.google.com/maps/embed/v1/place?key='+MAPS_KEY+
         '&q='+encodeURIComponent(q)+'&zoom=17&maptype='+MAPTYPE+'&language=ja&region=JP';
}
function toggleMap(){
  MAPTYPE = MAPTYPE==='roadmap' ? 'satellite' : 'roadmap';
  document.getElementById('mapFrame').src=mapSrc(CUR);
  document.getElementById('mapBtn').textContent = MAPTYPE==='roadmap'?'航空写真':'地図';
}
function routeTo(){
  var d=(CUR.lat&&CUR.lng)?(CUR.lat+','+CUR.lng):CUR.addr;
  openExternal('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(d));
}
function copyAddr(){ copyText(CUR.addr,'住所をコピーしました') }

// LINE内蔵ブラウザは navigator.clipboard が使えない端末があるため代替手段を用意
function copyText(text,okMsg){
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
    var ok=false;
    try{ ok=document.execCommand('copy') }catch(e){}
    document.body.removeChild(ta);
    toast(ok?okMsg:'コピーできませんでした。長押しで選択してください');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fallback);
  }else{ fallback() }
}

// ===== 座標の修正 =====
function posForm(){
  document.getElementById('posEdit').innerHTML=
    '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">'+
      '<div id="posMsg"></div>'+
      '<div class="row" style="margin-top:0">'+
        '<div style="flex:1"><label style="margin-top:0">緯度</label>'+
          '<input id="f_lat" inputmode="decimal" value="'+(CUR.lat||'')+'" placeholder="39.7036"></div>'+
        '<div style="flex:1"><label style="margin-top:0">経度</label>'+
          '<input id="f_lng" inputmode="decimal" value="'+(CUR.lng||'')+'" placeholder="141.1527"></div>'+
      '</div>'+
      '<div class="row">'+
        '<button onclick="useGPS()">現在地から取得</button>'+
        '<button onclick="cancelPos()">キャンセル</button>'+
        '<button class="btn-p" style="width:auto" onclick="savePos()">保存</button>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--sub);margin-top:8px">'+
        'PCの場合はGoogleマップ上で目的の地点を右クリックすると座標が表示され、'+
        'クリックでコピーできます。貼り付けると緯度と経度に自動で振り分けます。</div>'+
    '</div>';
  var la=document.getElementById('f_lat');
  la.addEventListener('paste',function(e){
    var t=(e.clipboardData||window.clipboardData).getData('text');
    var m=t.match(/(-?\d+\.\d+)\s*[,、]\s*(-?\d+\.\d+)/);
    if(m){e.preventDefault();
      document.getElementById('f_lat').value=m[1];
      document.getElementById('f_lng').value=m[2];}
  });
  document.getElementById('posEdit').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function cancelPos(){document.getElementById('posEdit').innerHTML=''}

function useGPS(){
  if(!navigator.geolocation){return note('posMsg','err','この端末では現在地を取得できません')}
  note('posMsg','','<div class="loading" style="padding:10px">現在地を取得中…</div>');
  navigator.geolocation.getCurrentPosition(function(pos){
    var c=pos.coords;
    document.getElementById('f_lat').value=c.latitude.toFixed(6);
    document.getElementById('f_lng').value=c.longitude.toFixed(6);
    note('posMsg','ok','取得しました（誤差およそ '+Math.round(c.accuracy)+' m）');
  },function(err){
    note('posMsg','err', err.code===1
      ? (IN_LINE
          ? '位置情報の利用が許可されていません。端末の設定 →「LINE」→「位置情報」を「使用中のみ許可」にしてください'
          : '位置情報の利用が許可されていません。端末の設定をご確認ください')
      : '現在地を取得できませんでした');
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

async function savePos(){
  var lat=document.getElementById('f_lat').value.trim();
  var lng=document.getElementById('f_lng').value.trim();
  if(!/^-?\d+(\.\d+)?$/.test(lat)||!/^-?\d+(\.\d+)?$/.test(lng)){
    return note('posMsg','err','緯度と経度は数値で入力してください');
  }
  if(Number(lat)<20||Number(lat)>46||Number(lng)<122||Number(lng)>154){
    if(!confirm('日本国内の範囲から外れています。このまま保存しますか？'))return;
  }
  var id=CUR.id;
  var r=await api({action:'saveSite',token:TOKEN,id:id,lat:lat,lng:lng});
  if(!r.ok){return note('posMsg','err',r.error)}
  await load();
  if(TOKEN) showDetail(id);
}

function showDetail(id){
  CUR=SITES.filter(function(s){return s.id===id})[0];
  if(!CUR)return;
  MAPTYPE='roadmap';
  document.getElementById('listView').classList.add('hide');
  document.getElementById('backBtn').classList.remove('hide');
  document.getElementById('ttl').textContent=CUR.name;
  var v=document.getElementById('detailView');
  v.classList.remove('hide');

  var mk=KEYS.filter(function(k){return k.siteId===CUR.id});
  var spec=[];
  if(CUR.kv) spec.push(CUR.kv+' kV');
  if(CUR.kw) spec.push(CUR.kw+' kW');

  v.innerHTML=
   '<div class="card">'+
     '<div style="font-weight:700;font-size:16px">'+esc(CUR.name)+
       (CUR.kind==='太陽光'?'<span class="tag solar">太陽光</span>':'')+'</div>'+
     '<div style="font-size:13px;color:var(--sub);margin:4px 0 12px">'+esc(CUR.addr)+
       (spec.length?' ／ '+spec.join(' ・ '):'')+'</div>'+
     (CUR.lat&&CUR.lng ? '' :
       '<div class="msg err">座標が未登録です。住所での概算表示になります。</div>')+
     '<iframe id="mapFrame" class="mapbox" loading="lazy" allowfullscreen '+
       'referrerpolicy="no-referrer-when-downgrade" src="'+mapSrc(CUR)+'"></iframe>'+
     '<div class="row">'+
       '<button onclick="routeTo()">経路案内</button>'+
       '<button id="mapBtn" onclick="toggleMap()">航空写真</button>'+
       '<button onclick="copyAddr()">住所コピー</button>'+
     '</div>'+
     '<div style="text-align:right;margin-top:8px">'+
       '<a href="#" class="link" onclick="posForm();return false">'+
       (CUR.lat&&CUR.lng?'位置がずれている場合はこちら':'座標を登録する')+'</a></div>'+
     '<div id="posEdit"></div>'+
   '</div>'+
   '<div class="keyhead"><h3>鍵・入場情報</h3>'+
     (CAN_EDIT?'<button class="btn-sm" onclick="keyForm()">＋ 追加</button>':'')+'</div>'+
   '<div id="keys"></div>'+
   '<div id="keyEdit"></div>';
  renderKeys();
  window.scrollTo(0,0);
}

function renderKeys(){
  var mk=KEYS.filter(function(k){return k.siteId===CUR.id});
  var el=document.getElementById('keys');
  if(!mk.length){el.innerHTML='<div class="empty">まだ登録がありません</div>';return}
  el.innerHTML=mk.map(function(k){
    return '<div class="kcard">'+
      '<div class="kp">'+esc(k.place||'（場所未記入）')+'</div>'+
      (k.code?'<div class="kc">'+esc(k.code)+'</div>':'')+
      (k.storage?'<div class="km">保管：'+esc(k.storage)+'</div>':'')+
      (k.contact?'<div class="km">連絡先：'+esc(k.contact)+'</div>':'')+
      (k.note?'<div class="km" style="margin-top:6px">'+esc(k.note)+'</div>':'')+
      '<div class="kb">'+esc(k.by)+' '+esc(k.at)+
        (CAN_EDIT?' ・ <a href="#" onclick="keyForm('+k.row+');return false">編集</a>'+
                  ' ・ <a href="#" onclick="delKey('+k.row+');return false">削除</a>':'')+
      '</div></div>';
  }).join('');
}

function keyForm(row){
  var k = row ? KEYS.filter(function(x){return x.row===row})[0] : {place:'',code:'',storage:'',contact:'',note:''};
  document.getElementById('keyEdit').innerHTML=
    '<div class="card">'+
      '<div style="font-weight:700;font-size:14px">'+(row?'鍵情報を編集':'鍵情報を追加')+'</div>'+
      '<label>鍵の場所・種類</label><input id="f_place" value="'+esc(k.place)+'" placeholder="正門ゲート／キュービクル扉">'+
      '<label>番号・暗証</label><input id="f_code" value="'+esc(k.code)+'" placeholder="南京錠 #4821 ／ ダイヤル 06-24-13">'+
      '<label>保管場所</label><input id="f_storage" value="'+esc(k.storage)+'" placeholder="事務所キーボックスB-3">'+
      '<label>立入連絡先</label><input id="f_contact" value="'+esc(k.contact)+'" placeholder="管理課 田中様 0196-xx-xxxx">'+
      '<label>メモ</label><textarea id="f_note" rows="3" placeholder="冬期は林道未除雪。北側通用口から進入。">'+esc(k.note)+'</textarea>'+
      '<div class="row"><button onclick="cancelKey()">キャンセル</button>'+
      '<button class="btn-p" style="width:auto" onclick="saveKey('+(row||0)+')">保存</button></div>'+
    '</div>';
  document.getElementById('keyEdit').scrollIntoView({behavior:'smooth'});
}
function cancelKey(){document.getElementById('keyEdit').innerHTML=''}

async function saveKey(row){
  var p={action:'saveKey',token:TOKEN,siteId:CUR.id,
    place:document.getElementById('f_place').value,
    code:document.getElementById('f_code').value,
    storage:document.getElementById('f_storage').value,
    contact:document.getElementById('f_contact').value,
    note:document.getElementById('f_note').value};
  if(row) p.row=row;
  var r=await api(p);
  if(!r.ok){alert(r.error);return}
  var id=CUR.id;
  cancelKey();
  await load();
  if(TOKEN) showDetail(id);
}
async function delKey(row){
  if(!confirm('この鍵情報を削除しますか？'))return;
  var id=CUR.id;
  var r=await api({action:'deleteKey',token:TOKEN,row:row});
  if(!r.ok){alert(r.error);return}
  await load(); if(TOKEN) showDetail(id);
}

// ===== パスワード再発行 =====
function showReset(){
  document.getElementById('resetBox').innerHTML=
    '<div class="card">'+
      '<div style="font-weight:700;font-size:14px;margin-bottom:4px">パスワードの再発行</div>'+
      '<div style="font-size:12px;color:var(--sub)">社員マスタに登録されたメールアドレス宛に仮パスワードをお送りします。</div>'+
      '<div id="resetMsg" style="margin-top:10px"></div>'+
      '<label>氏名</label><input id="r_user" placeholder="佐藤 英匡">'+
      '<label>登録メールアドレス</label><input id="r_mail" type="email" inputmode="email" placeholder="eita-satou@td-denki.com">'+
      '<div class="row">'+
        '<button onclick="closeReset()">閉じる</button>'+
        '<button class="btn-p" style="width:auto" onclick="doReset()">仮パスワードを送る</button>'+
      '</div>'+
    '</div>';
  document.getElementById('r_user').value=document.getElementById('u').value;
  document.getElementById('resetBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeReset(){document.getElementById('resetBox').innerHTML=''}

async function doReset(){
  var u=document.getElementById('r_user').value.trim();
  var m=document.getElementById('r_mail').value.trim();
  if(!u||!m) return note('resetMsg','err','氏名とメールアドレスを入力してください');
  note('resetMsg','','<div class="loading" style="padding:10px">送信中…</div>');
  try{
    var r=await api({action:'resetPass',user:u,email:m});
    if(!r.ok) return note('resetMsg','err',r.error);
    note('resetMsg','ok','仮パスワードをメールで送信しました。受信箱をご確認ください。');
  }catch(e){ note('resetMsg','err',e.message) }
}

// ===== パスワード変更 =====
function showAccount(){
  document.getElementById('listView').classList.add('hide');
  document.getElementById('detailView').classList.add('hide');
  document.getElementById('backBtn').classList.remove('hide');
  document.getElementById('ttl').textContent='アカウント設定';
  var v=document.getElementById('accountView');
  v.classList.remove('hide');
  v.innerHTML=
    '<div class="card">'+
      '<div style="font-weight:700;font-size:14px">パスワードの変更</div>'+
      '<div style="font-size:12px;color:var(--sub);margin-top:2px">'+esc(ME.name)+' さん</div>'+
      '<div id="pwMsg" style="margin-top:10px"></div>'+
      '<label>現在のパスワード</label><input id="c_old" type="password" autocomplete="current-password">'+
      '<label>新しいパスワード（6文字以上）</label><input id="c_new" type="password" autocomplete="new-password">'+
      '<label>新しいパスワード（確認）</label><input id="c_new2" type="password" autocomplete="new-password">'+
      '<div class="row">'+
        '<button onclick="showList()">戻る</button>'+
        '<button class="btn-p" style="width:auto" onclick="changePass()">変更する</button>'+
      '</div>'+
      '<button class="btn-out" onclick="logout()">ログアウト</button>'+
      '<div style="font-size:11px;color:var(--sub);margin-top:8px">'+
        'この端末ではログイン状態が保持されます。共用端末で使った場合はログアウトしてください。</div>'+
    '</div>';
  window.scrollTo(0,0);
}

function logout(){
  if(!confirm('ログアウトしますか？'))return;
  toLogin('','');
}

async function changePass(){
  var o=document.getElementById('c_old').value;
  var n=document.getElementById('c_new').value;
  var n2=document.getElementById('c_new2').value;
  if(!o||!n) return note('pwMsg','err','すべての欄を入力してください');
  if(n.length<6) return note('pwMsg','err','新しいパスワードは6文字以上にしてください');
  if(n!==n2) return note('pwMsg','err','確認用のパスワードが一致しません');
  note('pwMsg','','<div class="loading" style="padding:10px">変更中…</div>');
  try{
    var r=await api({action:'changePass',token:TOKEN,oldPass:o,newPass:n});
    if(!r.ok) return note('pwMsg','err',r.error);
    note('pwMsg','ok','パスワードを変更しました。次回から新しいパスワードでログインしてください。');
    document.getElementById('c_old').value='';
    document.getElementById('c_new').value='';
    document.getElementById('c_new2').value='';
  }catch(e){ note('pwMsg','err',e.message) }
}

if(LOGO_URL){
  document.getElementById('brandMark').outerHTML=
    '<img src="'+LOGO_URL+'" alt="匡電気管理事務所">';
  document.getElementById('brandSub').classList.add('hide');
}
document.getElementById('p').addEventListener('keydown',function(e){if(e.key==='Enter')login()});

boot();
